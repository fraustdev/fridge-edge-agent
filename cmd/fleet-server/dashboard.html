<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fridge Fleet Ops</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/leaflet.css">
<style>
  :root {
    --bg: #0f1113;
    --panel: #1a1d21;
    --panel-raised: #202327;
    --border: #2a2d33;
    --text: #e7e9ec;
    --muted: #8b9098;
    --healthy: #6fae8c;
    --healthy-bg: rgba(111, 174, 140, 0.16);
    --low_stock: #c9a15a;
    --low_stock-bg: rgba(201, 161, 90, 0.16);
    --faulted: #c97a6d;
    --faulted-bg: rgba(201, 122, 109, 0.16);
    --offline: #8b9098;
    --offline-bg: rgba(139, 144, 152, 0.16);
    --accent: #5b93c2;
    --accent-bg: rgba(91, 147, 194, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 18px 32px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header .title-row { display: flex; align-items: center; gap: 12px; }
  header .fridge-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 16px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; color: var(--text); }
  header .sub { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--healthy);
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0% { box-shadow: 0 0 0 0 rgba(111,174,140,0.55); }
    70% { box-shadow: 0 0 0 6px rgba(111,174,140,0); }
    100% { box-shadow: 0 0 0 0 rgba(111,174,140,0); }
  }

  main { padding: 28px 32px 60px; max-width: 1160px; margin: 0 auto; }
  section { margin-bottom: 34px; }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 500;
  }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
  }
  .stat-card .top-row { display: flex; align-items: center; justify-content: space-between; }
  .stat-card .n { font-size: 28px; font-weight: 600; line-height: 1; color: var(--text); }
  .stat-card .icon { font-size: 16px; opacity: 0.7; }
  .stat-card .label { font-size: 11.5px; color: var(--muted); text-transform: capitalize; margin-top: 4px; }
  .stat-card .spark { display: block; width: 100%; height: 26px; margin-top: 10px; }
  .stat-card.healthy .n { color: var(--healthy); }
  .stat-card.low_stock .n { color: var(--low_stock); }
  .stat-card.faulted .n { color: var(--faulted); }
  .stat-card.offline .n { color: var(--offline); }

  /* --- Map (Leaflet + CARTO dark tiles) --- */
  .map-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }
  .map-card .map-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
  }
  .map-card .map-count { font-size: 12px; color: var(--muted); }
  #leafletMap {
    width: 100%;
    height: 520px;
    border-radius: 10px;
    background: var(--panel-raised); /* shows while tiles load */
  }
  .fridge-marker {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
  }
  .fridge-marker.healthy { background: var(--healthy); }
  .fridge-marker.low_stock { background: var(--low_stock); }
  .fridge-marker.offline { background: var(--offline); }
  .fridge-marker.faulted {
    background: var(--faulted);
    animation: pin-pulse 1.4s infinite;
  }
  @keyframes pin-pulse {
    0% { box-shadow: 0 0 0 0 rgba(201,122,109,0.55), 0 0 0 1px rgba(255,255,255,0.15); }
    70% { box-shadow: 0 0 0 8px rgba(201,122,109,0), 0 0 0 1px rgba(255,255,255,0.15); }
    100% { box-shadow: 0 0 0 0 rgba(201,122,109,0), 0 0 0 1px rgba(255,255,255,0.15); }
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel-raised);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  .leaflet-popup-content { font-size: 13px; line-height: 1.5; margin: 10px 12px; }
  .leaflet-popup-close-button { color: var(--muted) !important; }
  .popup-title { font-weight: 600; margin-bottom: 2px; }
  .popup-sub { color: var(--muted); font-size: 12px; }
  .map-legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 10px; font-size: 12px; color: var(--muted);
  }
  .map-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .map-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .fridge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .fridge-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--offline);
    border-radius: 12px;
    padding: 11px 13px;
    font-size: 13px;
    display: flex;
    gap: 8px;
  }
  .fridge-card .glyph { font-size: 16px; line-height: 1; margin-top: 1px; opacity: 0.85; }
  .fridge-card.healthy { border-left-color: var(--healthy); }
  .fridge-card.low_stock { border-left-color: var(--low_stock); }
  .fridge-card.faulted { border-left-color: var(--faulted); }
  .fridge-card.offline { border-left-color: var(--offline); }
  .fridge-card .id { font-weight: 600; color: var(--text); }
  .fridge-card .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .fridge-card .loc { color: var(--muted); font-size: 11px; }
  .fridge-card .alert-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 10.5px;
    background: var(--faulted-bg);
    color: var(--faulted);
    padding: 1px 7px;
    border-radius: 999px;
    font-weight: 600;
  }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: capitalize;
  }
  .badge.healthy, .badge.low { background: var(--healthy-bg); color: var(--healthy); }
  .badge.low_stock, .badge.medium { background: var(--low_stock-bg); color: var(--low_stock); }
  .badge.faulted, .badge.high, .badge.open { background: var(--faulted-bg); color: var(--faulted); }
  .badge.offline, .badge.resolved { background: var(--offline-bg); color: var(--offline); }
  .badge.assigned { background: var(--accent-bg); color: var(--accent); }
  .badge.blocked { background: var(--low_stock-bg); color: var(--low_stock); }
  .badge.tier-high { background: var(--faulted-bg); color: var(--faulted); }
  .badge.tier-medium { background: var(--low_stock-bg); color: var(--low_stock); }
  .badge.tier-low { background: var(--offline-bg); color: var(--offline); }

  .blocked-reason { display: block; font-size: 10.5px; color: var(--low_stock); margin-top: 2px; }
  .priority-cell { font-variant-numeric: tabular-nums; color: var(--muted); }

  .alerts-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .alerts-toolbar .tabs { margin-bottom: 0; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
    font-weight: 500;
  }
  .tabs button.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--border); color: var(--text); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-raised); }
  .empty-row td { color: var(--muted); text-align: center; padding: 20px; }

  button.action {
    background: var(--accent);
    color: #0f1113;
    border: none;
    border-radius: 7px;
    padding: 5px 11px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 4px;
    font-weight: 600;
  }
  button.action.secondary { background: var(--panel-raised); color: var(--text); border: 1px solid var(--border); }
  button.action:hover { opacity: 0.88; }

  .copilot-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
  }
  .copilot-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .source-badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; }
  .source-badge.llm { background: var(--healthy-bg); color: var(--healthy); }
  .source-badge.heuristic { background: var(--offline-bg); color: var(--offline); }
  .narrative { font-size: 14px; line-height: 1.6; color: var(--text); }
  .narrative h4 { margin: 14px 0 4px; color: var(--text); }
  .narrative p { margin: 6px 0; }
  .stats-line { color: var(--muted); font-size: 12px; margin-top: 10px; }

  .refresh-btn {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    font-weight: 500;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .loading { color: var(--muted); font-size: 13px; font-style: italic; }

  .filter-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 14px; margin-bottom: 20px;
  }
  .filter-bar label { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .filter-bar select, .filter-bar input {
    background: var(--panel-raised); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); font-size: 12.5px; padding: 5px 9px;
  }
  .filter-bar select { min-width: 150px; }
  .filter-bar input { min-width: 220px; }
  .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--accent); }
  .filter-bar .fridge-count { margin-left: auto; font-size: 12px; color: var(--muted); }

  .state-group {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 2px 14px 12px; margin-bottom: 10px;
  }
  .state-group summary {
    cursor: pointer; padding: 10px 0; color: var(--text); font-weight: 600; font-size: 13px;
    display: flex; align-items: center; gap: 8px; list-style: none;
  }
  .state-group summary::-webkit-details-marker { display: none; }
  .state-group summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
  .state-group[open] summary::before { content: "▾"; }
  .state-group .state-count {
    font-size: 11px; color: var(--muted); font-weight: 500; background: var(--panel-raised);
    padding: 1px 8px; border-radius: 999px;
  }
  .state-group-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <div class="fridge-icon">&#129466;</div>
    <h1>Fridge Fleet Ops</h1>
  </div>
  <div class="sub"><span class="live-dot"></span><span id="lastUpdated">loading…</span></div>
</header>
<main>
  <section>
    <h2>Fleet Overview</h2>
    <div class="stat-row" id="statRow"></div>
  </section>

  <div class="filter-bar">
    <label>Location
      <select id="stateFilter"><option value="">All states</option></select>
    </label>
    <input type="text" id="fridgeSearch" placeholder="Search fridge id, city, or venue…">
    <button class="refresh-btn" id="clearFilterBtn">Clear filter</button>
    <span class="fridge-count" id="fridgeFilterCount"></span>
  </div>

  <section>
    <h2>Fleet Map</h2>
    <div class="map-card">
      <div class="map-toolbar">
        <span class="map-count" id="mapCount">loading…</span>
        <span class="map-count">scroll/pinch to zoom, drag to pan</span>
      </div>
      <div id="leafletMap"></div>
      <div class="map-legend">
        <span><i style="background:var(--healthy)"></i> Healthy</span>
        <span><i style="background:var(--low_stock)"></i> Low stock</span>
        <span><i style="background:var(--faulted)"></i> Faulted (pulsing)</span>
        <span><i style="background:var(--offline)"></i> Offline</span>
      </div>
    </div>
  </section>

  <section>
    <h2>Fridges</h2>
    <div id="fridgeGroups"></div>
  </section>

  <section>
    <h2>Alerts</h2>
    <div class="alerts-toolbar">
      <div class="tabs" id="alertTabs">
        <button data-status="" class="active">All</button>
        <button data-status="open">Open</button>
        <button data-status="assigned">Assigned</button>
        <button data-status="resolved">Resolved</button>
      </div>
      <button class="refresh-btn" id="assignNextBtn">Auto-assign highest priority</button>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>Fridge</th><th>Slot</th><th>Source</th><th>Severity</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Created</th><th></th></tr>
      </thead>
      <tbody id="alertRows"></tbody>
    </table>
  </section>

  <section>
    <h2>Ops Copilot Summary</h2>
    <div class="copilot-panel">
      <div class="copilot-header">
        <span id="sourceBadge"></span>
        <button class="refresh-btn" id="copilotRefresh">Regenerate summary</button>
      </div>
      <div id="copilotBody" class="loading">Not loaded yet — click "Regenerate summary".</div>
      <div class="stats-line" id="copilotStats"></div>
    </div>
  </section>
</main>

<script src="/static/leaflet.js"></script>
<script>
const STATUS_ORDER = ["healthy", "low_stock", "faulted", "offline"];
const STATUS_ICON = { healthy: "✅", low_stock: "⚠️", faulted: "❌", offline: "📴" };
let currentAlertFilter = "";

// Full fridge list from the last poll, and the current location filter
// applied on top of it -- with 2,000+ real locations, an unfiltered flat
// list/map is unusable, so both the "Fridges" section and the map respect
// this filter, grouped by state for a manageable default view.
let allFridges = [];
const locationFilter = { state: "", query: "" };

function getFilteredFridges() {
  return allFridges.filter(f => {
    if (locationFilter.state && (!f.location || f.location.state !== locationFilter.state)) return false;
    if (locationFilter.query) {
      const q = locationFilter.query.toLowerCase();
      const haystack = [f.id, f.location && f.location.city, f.location && f.location.name, f.location && f.location.vertical]
        .filter(Boolean).join(" ").toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function populateStateFilter(fridges) {
  const counts = {};
  fridges.forEach(f => {
    const st = f.location && f.location.state;
    if (st) counts[st] = (counts[st] || 0) + 1;
  });
  const select = document.getElementById("stateFilter");
  const prevValue = select.value;
  const states = Object.keys(counts).sort();
  select.innerHTML = `<option value="">All states (${fridges.length})</option>` +
    states.map(s => `<option value="${s}">${s} (${counts[s]})</option>`).join("");
  select.value = states.includes(prevValue) ? prevValue : "";
}

function fridgeCardHTML(f) {
  return `
    <div class="fridge-card ${f.status}">
      <div class="glyph">&#129466;</div>
      <div>
        <div class="id">${f.id}</div>
        <div class="meta">${f.status.replace("_", " ")} &middot; ${timeAgo(f.lastEventAt)}</div>
        ${f.location ? `<div class="loc">${f.location.vertical ? "[" + f.location.vertical + "] " : ""}${f.location.city}, ${f.location.state}</div>` : ""}
        ${f.tier ? `<span class="badge tier-${f.tier}">${f.tier} tier</span>` : ""}
        ${f.openAlertIds && f.openAlertIds.length ? `<div class="alert-badge">${f.openAlertIds.length} open alert${f.openAlertIds.length > 1 ? "s" : ""}</div>` : ""}
      </div>
    </div>`;
}

function renderFridgeGroups(filtered) {
  const container = document.getElementById("fridgeGroups");
  document.getElementById("fridgeFilterCount").textContent =
    `${filtered.length} of ${allFridges.length} fridges shown`;

  if (!filtered.length) {
    container.innerHTML = allFridges.length
      ? `<div class="loading">No fridges match this filter.</div>`
      : `<div class="loading">No fridges reporting yet — start cmd/fridge-sim.</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(f => {
    const key = (f.location && f.location.state) || "Unknown location";
    (groups[key] = groups[key] || []).push(f);
  });
  const keys = Object.keys(groups).sort();
  const singleGroup = keys.length === 1;

  container.innerHTML = keys.map(state => {
    const items = groups[state];
    const cardsHTML = `<div class="fridge-grid">${items.map(fridgeCardHTML).join("")}</div>`;
    if (singleGroup) {
      return `<div class="state-group-label">${state} &middot; ${items.length} fridge${items.length > 1 ? "s" : ""}</div>${cardsHTML}`;
    }
    const openAttr = items.length <= 12 ? " open" : "";
    return `<details class="state-group"${openAttr}>
      <summary>${state} <span class="state-count">${items.length}</span></summary>
      ${cardsHTML}
    </details>`;
  }).join("");
}

function fitMapToFridges(fridges) {
  if (!leafletMap) return;
  const withLoc = fridges.filter(f => f.location);
  if (!locationFilter.state && !locationFilter.query) {
    leafletMap.setView([39.5, -98.35], 4);
    return;
  }
  if (!withLoc.length) return;
  const bounds = L.latLngBounds(withLoc.map(f => [f.location.lat, f.location.lng]));
  leafletMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 10 });
}

function applyLocationFilter(fitBounds) {
  const filtered = getFilteredFridges();
  renderFridgeGroups(filtered);
  renderMap(filtered);
  if (fitBounds) fitMapToFridges(filtered);
}

// Rolling client-side history of each status's count, sampled once per
// poll (every 5s) -- a real trend of this session's polling, not a
// persisted historical series (the backend doesn't store one).
const HISTORY_LEN = 30;
const statHistory = { healthy: [], low_stock: [], faulted: [], offline: [] };

function pushStatHistory(counts) {
  STATUS_ORDER.forEach(s => {
    const arr = statHistory[s];
    arr.push(counts[s] || 0);
    if (arr.length > HISTORY_LEN) arr.shift();
  });
}

function sparklineSVG(values, statusKey) {
  const w = 100, h = 26;
  if (values.length < 2) return `<svg class="spark" viewBox="0 0 ${w} ${h}"></svg>`;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = Math.max(max - min, 1);
  const step = w / (values.length - 1);
  const pts = values.map((v, i) => {
    const x = i * step;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const areaPts = `0,${h} ${pts} ${w},${h}`;
  const colorVar = `var(--${statusKey})`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="${areaPts}" style="fill:${colorVar};opacity:0.15"></polygon>
    <polyline points="${pts}" style="fill:none;stroke:${colorVar};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"></polyline>
  </svg>`;
}

let leafletMap = null;
let markerLayer = null;

function initMap() {
  leafletMap = L.map("leafletMap", { worldCopyJump: true }).setView([39.5, -98.35], 4);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 18,
    subdomains: "abcd",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(leafletMap);
  markerLayer = L.layerGroup().addTo(leafletMap);
}

function timeAgo(iso) {
  const d = new Date(iso);
  const secs = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
  if (secs < 60) return secs + "s ago";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
  return Math.floor(secs / 86400) + "d ago";
}

function renderMap(fridges) {
  if (!leafletMap) initMap();
  markerLayer.clearLayers();

  const withLoc = fridges.filter(f => f.location);
  document.getElementById("mapCount").textContent = withLoc.length
    ? `${withLoc.length} fridge${withLoc.length === 1 ? "" : "s"} plotted`
    : "no fridge locations reported yet — run cmd/fridge-sim";

  withLoc.forEach(f => {
    const icon = L.divIcon({
      className: "",
      html: `<div class="fridge-marker ${f.status}"></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7],
      popupAnchor: [0, -8],
    });
    const loc = f.location;
    const venue = loc.name || `${loc.city}, ${loc.state}`;
    const marker = L.marker([loc.lat, loc.lng], { icon });
    marker.bindPopup(`
      <div class="popup-title">${f.id} &middot; ${f.status.replace("_", " ")}</div>
      <div class="popup-sub">${venue}</div>
      <div class="popup-sub">${loc.city}, ${loc.state}${loc.zip ? " " + loc.zip : ""}${loc.vertical ? " &middot; " + loc.vertical : ""}</div>
    `);
    markerLayer.addLayer(marker);
  });
}

async function refreshStatus() {
  const res = await fetch("/fleet/status");
  if (!res.ok) return;
  const data = await res.json();

  pushStatHistory(data.counts);

  const statRow = document.getElementById("statRow");
  statRow.innerHTML = STATUS_ORDER.map(s => `
    <div class="stat-card ${s}">
      <div class="top-row">
        <div class="n">${data.counts[s] || 0}</div>
        <div class="icon">${STATUS_ICON[s]}</div>
      </div>
      <div class="label">${s.replace("_", " ")}</div>
      ${sparklineSVG(statHistory[s], s)}
    </div>
  `).join("");

  allFridges = (data.fridges || []).slice().sort((a, b) => a.id.localeCompare(b.id));
  populateStateFilter(allFridges);
  applyLocationFilter(false);

  document.getElementById("lastUpdated").textContent = "updated " + new Date(data.generatedAt).toLocaleTimeString();
}

async function refreshAlerts() {
  const url = "/fleet/alerts" + (currentAlertFilter ? "?status=" + currentAlertFilter : "");
  const res = await fetch(url);
  if (!res.ok) return;
  const alerts = (await res.json()) || [];

  const rows = document.getElementById("alertRows");
  if (!alerts.length) {
    rows.innerHTML = `<tr class="empty-row"><td colspan="10">No alerts here.</td></tr>`;
    return;
  }
  rows.innerHTML = alerts.map(a => `
    <tr>
      <td>${a.id}</td>
      <td>${a.fridgeId}</td>
      <td>${a.slotId || "—"}</td>
      <td>${a.sourceEvent}</td>
      <td><span class="badge ${a.severity}">${a.severity}</span></td>
      <td class="priority-cell">${a.priority != null ? a.priority.toFixed(1) : "—"}</td>
      <td>
        ${a.blockedReason
          ? `<span class="badge blocked">blocked</span><span class="blocked-reason">${a.blockedReason}</span>`
          : `<span class="badge ${a.status}">${a.status}</span>`}
      </td>
      <td>${a.assignedTo || "—"}</td>
      <td>${timeAgo(a.createdAt)}</td>
      <td>
        ${a.status === "open" ? `<button class="action" onclick="assignAlert(${a.id})">Assign</button>` : ""}
        ${a.status === "assigned" ? `<button class="action secondary" onclick="resolveAlert(${a.id})">Resolve</button>` : ""}
      </td>
    </tr>
  `).join("");
}

async function assignAlert(id) {
  await fetch(`/fleet/alerts/${id}/assign`, { method: "POST" });
  refreshAlerts();
  refreshStatus();
}

async function resolveAlert(id) {
  await fetch(`/fleet/alerts/${id}/resolve`, { method: "POST" });
  refreshAlerts();
  refreshStatus();
}

async function assignNext() {
  const res = await fetch("/fleet/alerts/assign-next", { method: "POST" });
  const data = await res.json();
  refreshAlerts();
  refreshStatus();
  return data.assigned;
}

function renderNarrative(text) {
  const lines = (text || "").split("\n");
  let html = "";
  for (const line of lines) {
    if (!line.trim()) continue;
    if (line.startsWith("# ")) {
      html += `<h4>${line.slice(2)}</h4>`;
    } else {
      html += `<p>${line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</p>`;
    }
  }
  return html;
}

async function refreshCopilot() {
  const body = document.getElementById("copilotBody");
  const stats = document.getElementById("copilotStats");
  const badge = document.getElementById("sourceBadge");
  body.textContent = "Generating summary…";
  body.className = "loading";
  stats.textContent = "";
  badge.textContent = "";

  try {
    const res = await fetch("/fleet/copilot/summary");
    const data = await res.json();
    body.className = "narrative";
    body.innerHTML = renderNarrative(data.Narrative);
    badge.textContent = data.Source === "llm" ? "LLM" : "Heuristic fallback";
    badge.className = "source-badge " + (data.Source === "llm" ? "llm" : "heuristic");
    stats.textContent = `${data.TotalEvents} events · ${data.FridgesAffected} fridges · ` +
      `${data.HardwareFaults} hardware faults · ${data.RestockAlerts} restock alerts · ` +
      `${data.DoorAnomalies} door anomalies · ${data.ChargedNoItemCount} charged-no-item cases · ` +
      `generated ${new Date(data.GeneratedAt).toLocaleTimeString()}`;
  } catch (e) {
    body.textContent = "Failed to load summary: " + e;
  }
}

document.getElementById("alertTabs").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#alertTabs button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentAlertFilter = e.target.dataset.status;
  refreshAlerts();
});

document.getElementById("copilotRefresh").addEventListener("click", refreshCopilot);
document.getElementById("assignNextBtn").addEventListener("click", assignNext);

document.getElementById("stateFilter").addEventListener("change", (e) => {
  locationFilter.state = e.target.value;
  applyLocationFilter(true);
});
document.getElementById("fridgeSearch").addEventListener("input", (e) => {
  locationFilter.query = e.target.value;
  applyLocationFilter(true);
});
document.getElementById("clearFilterBtn").addEventListener("click", () => {
  locationFilter.state = "";
  locationFilter.query = "";
  document.getElementById("stateFilter").value = "";
  document.getElementById("fridgeSearch").value = "";
  applyLocationFilter(true);
});

refreshStatus();
refreshAlerts();
setInterval(refreshStatus, 5000);
setInterval(refreshAlerts, 5000);
</script>
</body>
</html>
